name: Build Teleprompter IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Gerekli Aracı Kur (Xcodegen)
        run: brew install xcodegen

      - name: Tüm Projeyi ve Kodları Tek Seferde Yaz
        run: |
          # 1. Arka Plan İzni (Info.plist)
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # 2. Xcode Proje İskeleti (project.yml)
          cat << 'EOF' > project.yml
          name: Teleprompter
          options:
            bundleIdPrefix: com.teleprompter
          targets:
            Teleprompter:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [Sources]
              info:
                path: Info.plist
          EOF
          
          # 3. Swift Kodları
          mkdir Sources
          cat << 'EOF' > Sources/App.swift
          import SwiftUI
          @main
          struct TeleprompterApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF
          
          cat << 'EOF' > Sources/ContentView.swift
          import SwiftUI
          import AVKit
          
          struct ContentView: View {
              @StateObject var pipManager = PiPManager()
              var body: some View {
                  VStack(spacing: 30) {
                      Text("Yüzen Teleprompter").font(.largeTitle).bold()
                      Text("PiP animasyonu için aşağıdaki kutu şarttır. Alta aldığında metin yüzecek!").multilineTextAlignment(.center).padding()
                      
                      // İŞTE ÇÖZÜM BURADA: PiP'in küçülme animasyonu için ekranda GERÇEK bir görünüm olması şart
                      PiPSourceView(pipManager: pipManager)
                          .frame(width: 200, height: 200)
                          .background(Color.black.opacity(0.1))
                          .cornerRadius(15)
                      
                      Button("PiP Başlat (Yüzen Ekran)") { 
                          pipManager.startPiP() 
                      }
                      .padding().background(Color.blue).foregroundColor(.white).cornerRadius(10)
                  }
              }
          }
          
          struct PiPSourceView: UIViewRepresentable {
              @ObservedObject var pipManager: PiPManager
              func makeUIView(context: Context) -> UIView {
                  let view = UIView()
                  // Görünüm ekrana yerleştiğinde PiP motoruna haber veriyoruz
                  DispatchQueue.main.async { self.pipManager.setupPiP(sourceView: view) }
                  return view
              }
              func updateUIView(_ uiView: UIView, context: Context) {}
          }
          
          class PiPManager: NSObject, ObservableObject {
              var pipController: AVPictureInPictureController?
              var textView: UITextView?
              var scrollTimer: Timer?
              
              func setupPiP(sourceView: UIView) {
                  guard AVPictureInPictureController.isPictureInPictureSupported() else { return }
                  let audioSession = AVAudioSession.sharedInstance()
                  try? audioSession.setCategory(.playback, mode: .moviePlayback, options: .mixWithOthers)
                  try? audioSession.setActive(true)
                  
                  let pipVC = AVPictureInPictureVideoCallViewController()
                  pipVC.view.backgroundColor = .black
                  
                  let tv = UITextView()
                  tv.text = "İşte iPhone 17 Pro Max orijinal kamerasıyla okuyacağın metin burada akacak!\n\nŞimdi cihazın ana ekranına dön, kameranı aç.\n\nBu metin sen okudukça otomatik olarak yukarı kayacak.\n\nGöz temasını hiç kaybetmeden, en yüksek kalitede, mükemmel bir çekim yapabilirsin!\n\n(Metin Sonu)"
                  tv.textColor = .white
                  tv.backgroundColor = .black
                  tv.font = UIFont.systemFont(ofSize: 22, weight: .bold)
                  tv.isEditable = false
                  tv.showsVerticalScrollIndicator = false
                  pipVC.view.addSubview(tv)
                  
                  // Metni ekrana tam oturtma ayarları
                  tv.translatesAutoresizingMaskIntoConstraints = false
                  NSLayoutConstraint.activate([
                      tv.topAnchor.constraint(equalTo: pipVC.view.topAnchor, constant: 15),
                      tv.bottomAnchor.constraint(equalTo: pipVC.view.bottomAnchor, constant: -15),
                      tv.leadingAnchor.constraint(equalTo: pipVC.view.leadingAnchor, constant: 15),
                      tv.trailingAnchor.constraint(equalTo: pipVC.view.trailingAnchor, constant: -15)
                  ])
                  
                  self.textView = tv
                  let source = AVPictureInPictureController.ContentSource(activeVideoCallSourceView: sourceView, contentViewController: pipVC)
                  pipController = AVPictureInPictureController(contentSource: source)
                  pipController?.canStartPictureInPictureAutomaticallyFromInline = true
              }
              
              func startPiP() { 
                  pipController?.startPictureInPicture() 
                  startScrolling()
              }
              
              func startScrolling() {
                  scrollTimer?.invalidate()
                  // Metni saniyede bir milim yukarı kaydıran motor
                  scrollTimer = Timer.scheduledTimer(withTimeInterval: 0.05, repeats: true) { [weak self] _ in
                      guard let tv = self?.textView else { return }
                      var offset = tv.contentOffset
                      offset.y += 0.8 // Kaydırma hızını buradan ayarlayabilirsin
                      if offset.y < (tv.contentSize.height - tv.bounds.height) {
                          tv.setContentOffset(offset, animated: false)
                      }
                  }
              }
          }
          EOF

      - name: Projeyi Derle ve IPA Oluştur
        run: |
          xcodegen generate
          xcodebuild clean build -project Teleprompter.xcodeproj -scheme Teleprompter -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -sdk iphoneos -derivedDataPath build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Teleprompter.app Payload/
          zip -r Teleprompter.ipa Payload

      - name: IPA Dosyasını Ver
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-IPA
          path: Teleprompter.ipa
